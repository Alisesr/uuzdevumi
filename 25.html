<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mana spēle</title>
<style>
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
h1 { text-align: center; }
button, input { font: inherit; padding: 10px; margin: 4px; }
button { cursor: pointer; }
img { max-width: 100%; height: auto; }
[hidden] { display: none !important; }
body { background-color: #641010; color: #17212b; }
button { background-color: #050c14; color: rgb(114, 10, 10); border: 0; border-radius: 12px; }
</style>
</head>
<body>
<h1>99 naktis mežā</h1>
<p>Savāc resursus. Aizej pie resursiem, lai iegūtu punktus.</p>
<img src="varonis.svg" alt="melns briesmonis ar sarkanām acīm" width="128">
<p>Uzvaras skaņa:</p>
<audio controls src="klikskis.wav"></audio>
<p id="punkti">Punkti: 0</p>
<button onclick="savakt()">iegūt punktu</button>
<script>
// Gatava poga. Šajā tēmā mācies noformēt lapu un sakārtot failus.
let punkti = 0;
function savakt() {
  punkti = punkti + 1;
  document.getElementById("punkti").textContent = "Punkti: " + punkti;
}
</script>
</body>
</html>
