<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>99 naktis mežā</title>
<style>
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; background-color: #14241b; color: #f1f5ee; }
button, input { font: inherit; padding: 10px; margin: 4px; }
button { cursor: pointer; background-color: #e58b36; color: #1b211a; border: 0; border-radius: 8px; }
img { max-width: 100%; height: auto; }
[hidden] { display: none !important; }
h1 { color: #f4c95d; font-size: 36px; text-align: center; }
.noteikumi { background-color: #e8eee1; color: #1b2b20; padding: 16px; border-radius: 12px; }
.laukums { box-sizing: border-box; padding: 20px; border: 3px dashed #f4c95d; border-radius: 12px; margin: 20px auto; max-width: 100%; text-align: center; background-color: #213a2d; }
</style>
</head>
<body>
<h1>99 naktis mežā</h1>
<p>Savāc resursus. Aizej pie resursiem, lai iegūtu punktus.</p>
<div class="laukums">
  <img src="atteli/varonis.png" alt="Melns, kokam līdzīgs tēls ar divām sarkanām acīm" width="128">
  <p>Briesmoņa skaņa</p>
  <audio controls src="skanas/klikskis.wav"></audio>
  <p id="punkti">Resursi: 0</p>
  <button onclick="savakt()">Iegūt resursu!</button>
</div>
<script>
// Gatava poga. Šajā tēmā mācies noformēt lapu un sakārtot failus.
let resursi = 0;
function savakt() {
  resursi = resursi + 1;
  document.getElementById("punkti").textContent = "Resursi: " + resursi;
}
</script>
</body>
</html>
